<!DOCTYPE html>
<html>
<head>
<title>Trading Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<div class="container mt-4">
<h2 class="text-center mb-4">Trading Dashboard</h2>
<div class="row">
<div class="col-md-6">
<h4>Alerts</h4>
<table class="table table-dark" id="alertsTable">
<thead><tr><th>Symbol</th><th>Action</th><th>Price</th><th>Time</th></tr></thead>
<tbody></tbody>
</table>
</div>
<div class="col-md-6">
<h4>Trades</h4>
<table class="table table-dark" id="tradesTable">
<thead><tr><th>Type</th><th>Entry</th><th>Exit</th><th>Qty</th><th>PNL</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
</div>
<script>
async function loadData(){
const alerts = await fetch('/alerts').then(r=>r.json());
const trades = await fetch('/trades').then(r=>r.json());

document.querySelector("#alertsTable tbody").innerHTML = alerts.map(a=>`
<tr><td>${a.symbol}</td><td>${a.action}</td><td>${a.price}</td><td>${a.datetime}</td></tr>`).join("");

document.querySelector("#tradesTable tbody").innerHTML = trades.map(t=>`
<tr><td>${t.type}</td><td>${t.entry_price||""}</td><td>${t.exit_price||""}</td><td>${t.quantity||""}</td><td>${t.pnl||""}</td></tr>`).join("");
}
setInterval(loadData,3000);
loadData();
</script>
</body>
</html>
