<!DOCTYPE html>
<html>
<head>
<title>Trading Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #0f172a;
    color: #e2e8f0;
}

.card {
    background: #1e293b;
    border: none;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.table {
    margin-bottom: 0;
}

.badge-buy { background: #16a34a; }
.badge-sell { background: #dc2626; }
.badge-exit { background: #f59e0b; color: black; }

.pnl-positive { color: #22c55e; font-weight: bold; }
.pnl-negative { color: #ef4444; font-weight: bold; }

.header-box {
    padding: 10px;
    border-radius: 10px;
    background: #1e293b;
    text-align: center;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">📊 Trading Dashboard</h2>

    <!-- 🔹 Controls -->
    <div class="row mb-3">
        <div class="col-md-4">
            <select id="symbolSelect" class="form-select">
                <option value="">All Symbols</option>
                <option value="BTCUSDT">BTCUSDT</option>
                <option value="ETHUSDT">ETHUSDT</option>
            </select>
        </div>

        <div class="col-md-4">
            <select id="limitSelect" class="form-select">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
            </select>
        </div>
    </div>

    <div class="row">

        <!-- Alerts -->
        <div class="col-md-6">
            <div class="card p-3">
                <h5>🚨 Alerts</h5>
                <table class="table table-dark table-hover" id="alertsTable">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Action</th>
                            <th>Price</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- Trades -->
        <div class="col-md-6">
            <div class="card p-3">
                <h5>💼 Trades</h5>
                <table class="table table-dark table-hover" id="tradesTable">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Entry</th>
                            <th>Exit</th>
                            <th>Qty</th>
                            <th>PNL</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script>
let limit = 20;
let symbol = "";

// 🔹 Build API URL
function buildUrl(base) {
    let url = base + "?limit=" + limit;
    if (symbol) url += "&symbol=" + symbol;
    return url;
}

// 🔹 Action badge styling
function getActionBadge(action) {
    if (action.includes("BUY")) return `<span class="badge badge-buy">${action}</span>`;
    if (action.includes("SELL")) return `<span class="badge badge-sell">${action}</span>`;
    return `<span class="badge badge-exit">${action}</span>`;
}

// 🔹 PnL styling
function getPnL(pnl) {
    if (!pnl) return "";
    return pnl > 0
        ? `<span class="pnl-positive">+${pnl.toFixed(2)}</span>`
        : `<span class="pnl-negative">${pnl.toFixed(2)}</span>`;
}

async function loadData() {

    const alerts = await fetch(buildUrl('/alerts')).then(r => r.json());
    const trades = await fetch(buildUrl('/trades')).then(r => r.json());

    // Alerts
    document.querySelector("#alertsTable tbody").innerHTML =
        alerts.map(a => `
        <tr>
            <td>${a.symbol}</td>
            <td>${getActionBadge(a.action)}</td>
            <td>${a.price}</td>
            <td>${a.datetime}</td>
        </tr>`).join("");

    // Trades
    document.querySelector("#tradesTable tbody").innerHTML =
        trades.map(t => `
        <tr>
            <td>${getActionBadge(t.type)}</td>
            <td>${t.entry_price || ""}</td>
            <td>${t.exit_price || ""}</td>
            <td>${t.quantity || ""}</td>
            <td>${getPnL(t.pnl)}</td>
        </tr>`).join("");
}

// Dropdown events
document.getElementById("symbolSelect").addEventListener("change", (e) => {
    symbol = e.target.value;
    loadData();
});

document.getElementById("limitSelect").addEventListener("change", (e) => {
    limit = e.target.value;
    loadData();
});

// Refresh
setInterval(loadData, 3000);
loadData();
</script>

</body>
</html>
