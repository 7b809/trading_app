<!doctype html>
<html>
  <head>
    <title>Trading Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #0f172a;
        color: #e2e8f0;
      }

      .card {
        background: #1e293b;
        border: none;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      }

      .table {
        margin-bottom: 0;
      }

      .badge-buy {
        background: #16a34a;
      }
      .badge-sell {
        background: #dc2626;
      }
      .badge-exit {
        background: #f59e0b;
        color: black;
      }

      .pnl-positive {
        color: #22c55e;
        font-weight: bold;
      }
      .pnl-negative {
        color: #ef4444;
        font-weight: bold;
      }

      .header-box {
        padding: 10px;
        border-radius: 10px;
        background: #1e293b;
        text-align: center;
        font-weight: bold;
      }

      .table-container {
        max-height: 500px;
        overflow-y: auto;
      }
    </style>
  </head>

  <body>
    <div class="container mt-4">
      <h2 class="text-center mb-4">📊 Trading Dashboard</h2>

      <!-- 🔹 Controls -->
      <div class="row mb-3">
        <div class="col-md-4">
          <select id="symbolSelect" class="form-select">
            <option value="">All Symbols</option>
          </select>
        </div>

        <div class="col-md-4">
          <input
            type="number"
            id="limitSelect"
            class="form-control"
            value="50"
            min="1"
            max="1000"
          />
        </div>
      </div>

      <div class="row">
        <!-- Alerts (FULL WIDTH NOW) -->
        <div class="col-md-12">
          <div class="card p-3">
            <h5>🚨 Alerts</h5>

            <div class="table-container">
              <table class="table table-dark table-hover" id="alertsTable">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Symbol</th>
                    <th>Action</th>
                    <th>Price</th>
                    <th>Time</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

          </div>
        </div>
      </div>
    </div>

    <script>
      let limit = 20;
      let symbol = "";

      function buildUrl(base) {
        let url = base + "?limit=" + limit;
        if (symbol) url += "&symbol=" + symbol;
        return url;
      }

      function getActionBadge(action) {
        if (action === "CE_ENTRY" || action === "CE_BUY")
          return `<span class="badge badge-buy">CE BUY</span>`;

        if (action === "CE_EXIT" || action === "CE_EXIT_BUY")
          return `<span class="badge badge-exit">CE EXIT</span>`;

        if (action === "PE_ENTRY" || action === "PE_SELL")
          return `<span class="badge badge-sell">PE BUY</span>`;

        if (action === "PE_EXIT" || action === "PE_EXIT_SELL")
          return `<span class="badge badge-exit">PE EXIT</span>`;

        return `<span class="badge">${action}</span>`;
      }

      function getOrderNumber(action) {
        if (action === "CE_ENTRY" || action === "CE_BUY") return 1;
        if (action === "CE_EXIT" || action === "CE_EXIT_BUY") return 2;
        if (action === "PE_ENTRY" || action === "PE_SELL") return 3;
        if (action === "PE_EXIT" || action === "PE_EXIT_SELL") return 4;
        return "";
      }

      /* ✅ NEW: IST FORMAT FUNCTION (ADDED ONLY) */
      function formatToIST(datetimeStr) {
        if (!datetimeStr) return "";

        const date = new Date(datetimeStr);

        return date.toLocaleString("en-IN", {
          timeZone: "Asia/Kolkata",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });
      }

      async function loadData() {
        const alerts = await fetch(buildUrl("/alerts")).then((r) => r.json());

        document.querySelector("#alertsTable tbody").innerHTML = alerts
          .map(
            (a) => `
<tr>
    <td>${getOrderNumber(a.option_type + "_" + a.action)}</td>
    <td>${a.symbol}</td>
    <td>${getActionBadge(a.option_type + "_" + a.action)}</td>
    <td>${a.price}</td>
    <td>${formatToIST(a.datetime)}</td>
</tr>`
          )
          .join("");
      }

      document
        .getElementById("symbolSelect")
        .addEventListener("change", (e) => {
          symbol = e.target.value;
          loadData();
        });

      document.getElementById("limitSelect").addEventListener("input", (e) => {
        limit = e.target.value;
        loadData();
      });

      async function init() {
        await loadSymbols();
        loadData();
        setInterval(loadData, 3000);
      }

      init();

      async function loadSymbols() {
        const symbols = await fetch("/symbols").then((r) => r.json());

        const dropdown = document.getElementById("symbolSelect");
        dropdown.innerHTML = '<option value="">All Symbols</option>';

        symbols.forEach((sym) => {
          dropdown.innerHTML += `<option value="${sym}">${sym}</option>`;
        });
      }
    </script>
  </body>
</html>
